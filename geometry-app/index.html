function generateQuestion() {
    const shapeTypes = [
        { type: 'square', name: '正方形', params: ['side'], paramNames: ['边长'] },
        { type: 'rectangle', name: '长方形', params: ['width', 'height'], paramNames: ['长', '宽'] },
        { type: 'circle', name: '圆形', params: ['radius'], paramNames: ['半径'] },
        { type: 'equilateralTriangle', name: '等边三角形', params: ['side'], paramNames: ['边长'] },
        { type: 'cube', name: '立方体', params: ['side'], paramNames: ['边长'] },
        { type: 'sphere', name: '球体', params: ['radius'], paramNames: ['半径'] },
        { type: 'cylinder', name: '圆柱体', params: ['radius', 'height'], paramNames: ['底面半径', '高'] },
        { type: 'cone', name: '圆锥体', params: ['radius', 'height'], paramNames: ['底面半径', '高'] }
    ];

    const shape = shapeTypes[Math.floor(Math.random() * shapeTypes.length)];

    // 生成随机参数（1-10之间，保留1位小数）
    const values = shape.params.map(() => parseFloat((Math.random() * 9 + 1).toFixed(1)));

    // 构建参数描述
    const paramDesc = shape.paramNames.map((name, i) => `${name}为 ${values[i]}`).join('，');

    const data = { type: shape.type };
    shape.params.forEach((param, i) => {
        data[param] = values[i];
    });
    const computation = getGeometryComputation(data);
    const result = computation.results[Math.floor(Math.random() * computation.results.length)];

    return {
        text: `请创建一个【${shape.name}】，设置${paramDesc}，它的${result.label}是多少？（保留两位小数）`,
        answer: parseFloat(result.value)
    };
}

function nextPracticeQuestion() {
    currentQuestion = generateQuestion();
    document.getElementById('practiceQuestion').textContent = currentQuestion.text;
    document.getElementById('practiceAnswer').value = '';
    document.getElementById('practiceResult').innerHTML = '';
}

function submitPracticeAnswer() {
    if (!currentQuestion) return;
    const userAnswer = parseFloat(document.getElementById('practiceAnswer').value);
    const resultDiv = document.getElementById('practiceResult');

    if (isNaN(userAnswer)) {
        resultDiv.innerHTML = '<div class="modal-result wrong">请输入一个数字！</div>';
        return;
    }

    // 允许0.1的误差
    const diff = Math.abs(userAnswer - currentQuestion.answer);
    if (diff < 0.1) {
        resultDiv.innerHTML = '<div class="modal-result correct">太棒了！回答正确！</div>';
    } else {
        resultDiv.innerHTML = `<div class="modal-result wrong">答错了，正确答案是 ${currentQuestion.answer}。再想想哦！</div>`;
    }
}

// ==================== 功能4: 图形对比 ====================
function toggleCompare(id) {
    const mesh = shapes.find(s => s.userData.id === id);
    if (!mesh) return;

    const idx = comparisonList.findIndex(c => c.userData.id === id);
    if (idx > -1) {
        comparisonList.splice(idx, 1);
    } else {
        if (comparisonList.length >= 2) {
            // 替换最早的
            comparisonList.shift();
        }
        comparisonList.push(mesh);
    }

    updateShapeList();
    updateComparePanel();
}

function clearComparison() {
    comparisonList = [];
    updateShapeList();
    updateComparePanel();
}

function getShapeCalcData(mesh) {
    const d = mesh.userData;
    const computation = getGeometryComputation(d);
    return {
        name: d.name,
        params: getShapeParams(d),
        results: computation.results
    };
}

function updateComparePanel() {
    const section = document.getElementById('compareSection');
    const panel = document.getElementById('comparePanel');

    if (comparisonList.length < 2) {
        if (comparisonList.length === 0) {
            section.style.display = 'none';
        } else {
            section.style.display = 'block';
            panel.innerHTML = '<div style="font-size:12px;color:#999;text-align:center;padding:10px;">已选1个图形，再选1个即可对比</div>';
        }
        return;
    }

    section.style.display = 'block';
    const a = getShapeCalcData(comparisonList[0]);
    const b = getShapeCalcData(comparisonList[1]);

    let html = `<div class="compare-panel">
        <div class="compare-title">⚖️ 图形对比</div>
        <div class="compare-item a">
            <div class="ci-name">${a.name}</div>
            ${a.params.map(p => '<div class="ci-row"><span>' + p.label + '</span><span>' + p.value + '</span></div>').join('')}
            ${a.results.map(r => '<div class="ci-row"><span>' + r.label + '</span><span>' + r.value + '</span></div>').join('')}
        </div>
        <div class="compare-item b">
            <div class="ci-name">${b.name}</div>
            ${b.params.map(p => '<div class="ci-row"><span>' + p.label + '</span><span>' + p.value + '</span></div>').join('')}
            ${b.results.map(r => '<div class="ci-row"><span>' + r.label + '</span><span>' + r.value + '</span></div>').join('')}
        </div>
    </div>`;

    panel.innerHTML = html;
}

// ==================== 功能6: 尺寸标注 ====================
function createLabel(text, position) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(255,107,107,0.9)';
    // 兼容旧浏览器的 roundRect
    if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(4, 4, 248, 56, 12);
        ctx.fill();
    } else {
        ctx.fillRect(4, 4, 248, 56);
    }
    ctx.fillStyle = 'white';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 32);
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(material);
    sprite.position.copy(position);
    sprite.scale.set(2, 0.5, 1);
    sprite.raycast = function() {};
    return sprite;
}

function removeLabels() {
    labels.forEach(label => {
        scene.remove(label);
        disposeObject3D(label);
    });
    labels = [];
}

function createLabelsForShape(mesh) {
    removeLabels();
    const data = mesh.userData;
    const pos = mesh.position;

    // 辅助函数：获取图形在世界坐标中的顶部Y值（用于平面图形标注高度）
    function getTopY() {
        if (data.is3D) {
            // 立体图形：用bounding box获取准确的顶部
            const worldBox = new THREE.Box3().setFromObject(mesh);
            return worldBox.max.y;
        } else {
            // 平面图形：ExtrudeGeometry rotateX(PI/2)后 y范围是[pos.y-0.1, pos.y]或[pos.y, pos.y+0.1]
            // 统一取 pos.y + 0.12 作为标注高度
            return pos.y + 0.12;
        }
    }

    switch(data.type) {
        case 'square': {
            const s = data.side;
            const topY = getTopY();
            // 只标两条相邻边，避免重复
            labels.push(createLabel('边长=' + s, new THREE.Vector3(pos.x + s/2 + 0.3, topY, pos.z)));
            labels.push(createLabel('边长=' + s, new THREE.Vector3(pos.x, topY, pos.z + s/2 + 0.3)));
            break;
        }
        case 'rectangle': {
            const w = data.width, h = data.height;
            const topY = getTopY();
            labels.push(createLabel('长=' + w, new THREE.Vector3(pos.x + w/2 + 0.3, topY, pos.z)));
            labels.push(createLabel('宽=' + h, new THREE.Vector3(pos.x, topY, pos.z + h/2 + 0.3)));
            break;
        }
        case 'circle': {
            const r = data.radius;
            const topY = getTopY();
            labels.push(createLabel('r=' + r, new THREE.Vector3(pos.x + r + 0.3, topY, pos.z)));
            break;
        }
        case 'equilateralTriangle': {
            const s = data.side;
            const topY = getTopY();
            labels.push(createLabel('边长=' + s, new THREE.Vector3(pos.x + s/2 + 0.3, topY, pos.z)));
            break;
        }
        case 'isoscelesTriangle': {
            const b = data.base, h = data.height;
            const topY = getTopY();
            labels.push(createLabel('底=' + b, new THREE.Vector3(pos.x + b/2 + 0.3, topY, pos.z)));
            // 高标注放在图形上方中心，避免飞出几何体范围
            labels.push(createLabel('高=' + h, new THREE.Vector3(pos.x, topY + 0.15, pos.z)));
            break;
        }
        case 'parallelogram': {
            const b = data.base, s = data.side, ang = Math.round(data.angle);
            const topY = getTopY();
            labels.push(createLabel('底=' + b, new THREE.Vector3(pos.x + b/2 + 0.3, topY, pos.z)));
            labels.push(createLabel('侧=' + s, new THREE.Vector3(pos.x - b/2 - 0.5, topY, pos.z + 0.5)));
            labels.push(createLabel('角=' + ang + '°', new THREE.Vector3(pos.x + b/2 + 0.3, topY + 0.15, pos.z + 0.5)));
            break;
        }
        case 'trapezoid': {
            const bb = data.bottomBase, tb = data.topBase, h = data.height;
            const topY = getTopY();
            // 梯形在Shape坐标系中：下底在z=-h/2，上底在z=+h/2
            // rotateX(PI/2)后Shape的y变成世界的z
            labels.push(createLabel('下底=' + bb, new THREE.Vector3(pos.x, topY, pos.z - h/2)));
            labels.push(createLabel('上底=' + tb, new THREE.Vector3(pos.x, topY, pos.z + h/2)));
            break;
        }
        case 'cube': {
            const s = data.side;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            labels.push(createLabel('边长=' + s, new THREE.Vector3(worldBox.max.x + 0.3, pos.y, pos.z)));
            break;
        }
        case 'sphere': {
            const r = data.radius;
            labels.push(createLabel('r=' + r, new THREE.Vector3(pos.x + r + 0.3, pos.y, pos.z)));
            break;
        }
        case 'cylinder': {
            const r = data.radius, h = data.height;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            // r标注在底部外侧
            labels.push(createLabel('r=' + r, new THREE.Vector3(worldBox.max.x + 0.3, worldBox.min.y + 0.1, pos.z)));
            // h标注在侧面，z方向偏移避免与r重叠
            labels.push(createLabel('h=' + h, new THREE.Vector3(worldBox.max.x + 0.3, pos.y, pos.z + 0.5)));
            break;
        }
        case 'cone': {
            const r = data.radius, h = data.height;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            // r标注在底面外侧
            labels.push(createLabel('r=' + r, new THREE.Vector3(worldBox.max.x + 0.3, worldBox.min.y + 0.1, pos.z)));
            // h标注在顶点上方
            labels.push(createLabel('h=' + h, new THREE.Vector3(pos.x, worldBox.max.y + 0.3, pos.z)));
            break;
        }
        case 'cuboid': {
            const l = data.length, w = data.width, h = data.height;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            const min = worldBox.min, max = worldBox.max;
            // 三个标注分散在三个不同位置，避免重叠
            // 长标注：底面右侧边缘
            labels.push(createLabel('长=' + l, new THREE.Vector3(max.x + 0.3, min.y + 0.15, pos.z)));
            // 宽标注：底面前侧边缘（与长错开高度）
            labels.push(createLabel('宽=' + w, new THREE.Vector3(pos.x, min.y + 0.15, max.z + 0.3)));
            // 高标注：右侧面顶部（与前两个完全错开）
            labels.push(createLabel('高=' + h, new THREE.Vector3(max.x + 0.3, max.y + 0.3, max.z + 0.3)));
            break;
        }
        case 'triangularPrism': {
            const b = data.base, th = data.triHeight, d = data.depth;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            const min = worldBox.min, max = worldBox.max;
            // 底边标注：放在顶面(y=max.y)上方，底边所在z位置(min.z)
            labels.push(createLabel('底=' + b, new THREE.Vector3(pos.x + b/2 + 0.3, max.y + 0.3, min.z + 0.3)));
            // 三角形高：放在顶面，靠近顶点(z=max.z)
            labels.push(createLabel('高=' + th, new THREE.Vector3(pos.x + 0.3, max.y + 0.3, max.z + 0.3)));
            // 棱柱长度：放在侧面中间高度
            labels.push(createLabel('长=' + d, new THREE.Vector3(pos.x, pos.y, min.z - 0.3)));
            break;
        }
        case 'squarePyramid': {
            const s = data.side, ph = data.pyramidHeight;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            // 边长标注放在底面外侧
            labels.push(createLabel('边=' + s, new THREE.Vector3(worldBox.max.x + 0.3, worldBox.min.y + 0.3, pos.z)));
            // 高标注在顶点上方
            labels.push(createLabel('h=' + ph, new THREE.Vector3(pos.x, worldBox.max.y + 0.3, pos.z)));
            break;
        }
        case 'frustum': {
            const tr = data.topRadius, br = data.bottomRadius, fh = data.height;
            const worldBox = new THREE.Box3().setFromObject(mesh);
            // 下底半径标注在底部外侧
            labels.push(createLabel('R=' + br, new THREE.Vector3(worldBox.max.x + 0.3, worldBox.min.y + 0.1, pos.z)));
            // 上底半径标注在顶部外侧
            labels.push(createLabel('r=' + tr, new THREE.Vector3(pos.x + tr + 0.3, worldBox.max.y - 0.1, pos.z)));
            // 高标注在侧面，z方向偏移避免重叠
            labels.push(createLabel('h=' + fh, new THREE.Vector3(worldBox.max.x + 0.3, pos.y, pos.z + 0.5)));
            break;
        }
    }

    labels.forEach(label => scene.add(label));
}
</script>
